# Illustrative settings; choose sequence limits and batch sizes for your model.
# Supported families: qwen3_5, mistral3. Attention LoRA targets follow the family.
model_family: qwen3_5
seed: 42
epochs: 1
max_sequence_length: 2048
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
optimizer:
  learning_rate: 1.0e-6
  effective_batch_size: 8
  microbatch_size: 1
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  weight_decay: 0.01
  gradient_clip_norm: 1.0
scheduler:
  warmup_ratio: 0.05
  minimum_learning_rate_ratio: 0.1
