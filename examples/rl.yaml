# Illustrative values only; choose lengths and resource sizes for your model.
defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath:
    - pkg://verl.trainer.config
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
critic:
  enable: false
data:
  train_files: ${oc.env:TRAIN_FILE}
  val_files: ${oc.env:VAL_FILE}
  train_batch_size: 8
  max_prompt_length: 1024
  max_response_length: 2048
  truncation: error
  filter_overlong_prompts: false
actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH}
  actor:
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: false
    optim:
      lr: 1.0e-6
  rollout:
    name: vllm
    n: 4
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
reward:
  custom_reward_function:
    path: methods/rl/reward.py
    name: compute_score
trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  logger: [console]
  project_name: learning-to-be-monitored
  experiment_name: rl-example
  default_local_dir: outputs/rl
  resume_mode: disable
  save_freq: -1
