[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorability-eval"
version = "0.1.0"
description = "MonitorBench intervention evaluation with causal-recall bounds"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["torch==2.11.0", "vllm==0.23.0", "transformers==5.12.1", "numpy==2.3.5", "openai-harmony==0.0.8", "pylatexenc==2.10", "PyYAML", "sympy", "openai"]

[project.scripts]
monitorability-eval = "monitorability_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
monitorability_eval = ["assets/**/*.json", "assets/**/*.jsonl", "assets/**/*.yaml", "assets/*.json"]
